name: Discord status update

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      summary:
        description: Optional summary for a manual status update
        required: false
        type: string

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Post change summary to Discord
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        with:
          script: |
            const webhookUrl = process.env.DISCORD_WEBHOOK_URL;
            if (!webhookUrl) {
              core.setFailed('Set the DISCORD_WEBHOOK_URL repository secret before using this workflow.');
              return;
            }

            const branch = context.ref.replace('refs/heads/', '');
            const manualSummary = context.payload.inputs?.summary?.trim();
            const commits = context.payload.commits ?? [];
            const visibleCommits = commits.slice(-10);
            const commitLines = visibleCommits.map((commit) => {
              const firstLine = commit.message.split('\n')[0].trim();
              return `- ${firstLine} (${commit.author.name})`;
            });

            let description = manualSummary || 'Repository changes were pushed.';
            if (commitLines.length > 0) {
              description += `\n\n${commitLines.join('\n')}`;
              if (commits.length > visibleCommits.length) {
                description += `\n- Plus ${commits.length - visibleCommits.length} more commits`;
              }
            }

            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                username: 'HomeChef status',
                allowed_mentions: { parse: [] },
                embeds: [
                  {
                    title: `HomeChef update - ${branch}`,
                    description: description.slice(0, 4096),
                    color: 0x5865f2,
                    timestamp: new Date().toISOString(),
                    url: context.payload.compare ?? undefined,
                  },
                ],
              }),
            });

            if (!response.ok) {
              core.setFailed(`Discord returned ${response.status}: ${(await response.text()).slice(0, 500)}`);
            }
